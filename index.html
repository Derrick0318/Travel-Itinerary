<!DOCTYPE html>

<head>

<title>Half Old Streets, Half Future — my trip</title>
<meta name="description" content="My personal companion for the 7-day Chaoshan &amp; Guangdong trip.">
<meta name="theme-color" content="#f5ecd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10142a" media="(prefers-color-scheme: dark)">

<body>
<a class="skip" href="#main" data-i="skip">Skip to content</a>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" aria-label="My trip">
      <span class="brand-mark" aria-hidden="true">信</span>
      <span class="brand-text"><b data-i="brand">My Trip</b><small data-i="brandSub">a love letter on the road</small></span>
    </a>
    <nav class="topnav" aria-label="Sections" data-i-label="navLabel">
      <a href="#days" data-nav="days" data-i="navDays">Days</a>
      <a href="#map" data-nav="map" data-i="navMap">Map</a>
      <a href="#food" data-nav="food" data-i="navFood">Food</a>
      <a href="#info" data-nav="info" data-i="navInfo">Info</a>
    </nav>
    <div class="lang" role="group" aria-label="Language" data-i-label="langLabel">
      <button type="button" data-act="lang" data-v="zh" lang="zh-CN">中</button>
      <button type="button" data-act="lang" data-v="en" lang="en">EN</button>
    </div>

  <div class="trail" aria-hidden="true"><div class="base"></div><div class="fill" id="trail-fill"></div><span class="plane" id="trail-plane">✈︎</span></div>

  <section id="days" class="sec" aria-labelledby="h-days">
    <div class="wrap">
      <div id="flights-slot"></div>
      <div id="days-head"></div>
    </div>
    <div class="chips-bar" id="chips-bar">
      <div class="wrap"><div class="chips" id="chips" role="group" data-i-label="chipsLabel"></div></div>
    </div>
    <div class="wrap"><div id="days-slot" class="day-list"></div></div>
  </section>

  <section id="map" class="sec" aria-labelledby="h-map">
    <div class="wrap" id="map-slot"></div>
  </section>

  <section id="food" class="sec" aria-labelledby="h-food">
    <div class="wrap" id="food-slot"></div>
  </section>

  <section id="info" class="sec" aria-labelledby="h-info">
    <div class="wrap" id="info-slot"></div>
  </section>
</main>

<footer class="foot">
  <div class="airmail" aria-hidden="true"></div>
  <div class="wrap">
    <p data-i="footPhotos">Photos: Wikimedia Commons</p>
    <p data-i="footItin">Itinerary: Brighton Travel &amp; Tour (prepared by Amy)</p>
    <p class="foot-small" data-i="footMine">Made for my own trip. Not an official booking page.</p>
  </div>
</footer>

<nav class="tabbar" id="tabbar" aria-label="Sections" data-i-label="navLabel" data-none="true">

  <a href="#food" data-nav="food"><span class="ti" aria-hidden="true">🍜</span><span data-i="navFood">Food</span></a>

</nav>

  <div class="sheet-bg" data-act="closesheet"></div>
